<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Shanzay 🤌🏻💖</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at 10% 10%, #8b5e3c 0%, transparent 30%),
    radial-gradient(circle at 90% 20%, #d98fa8 0%, transparent 28%),
    radial-gradient(circle at 50% 100%, #6d4a9e 0%, transparent 35%),
    linear-gradient(135deg,#211512,#43281f,#5a3b68);

    color:white;
    overflow:hidden;
}


/* ================= MOVING FLAG ================= */

.flag{
    position:fixed;

    top:22px;
    right:25px;

    width:145px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
    linear-gradient(
        135deg,
        #6f4935,
        #b86f88,
        #74539b
    );

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 8px 25px rgba(0,0,0,.35);

    color:#fff5f2;

    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;

    transform-origin:left center;

    animation:flagMove 2.2s ease-in-out infinite;

    z-index:50;
}

.flag::before{
    content:"";
    position:absolute;

    left:0;
    top:0;

    width:7px;
    height:100%;

    background:#f4d6c8;

    border-radius:8px 0 0 8px;
}

@keyframes flagMove{

    0%,100%{
        transform:
        perspective(400px)
        rotateY(0deg)
        rotateZ(0deg);
    }

    50%{
        transform:
        perspective(400px)
        rotateY(-14deg)
        rotateZ(2deg);
    }

}


/* ================= CARD ================= */

.container{
    width:100%;
    max-width:570px;

    min-height:500px;

    padding:35px 24px;

    border-radius:34px;

    background:
    linear-gradient(
        145deg,
        rgba(55,34,25,.94),
        rgba(55,30,42,.94),
        rgba(39,28,52,.94)
    );

    border:1px solid rgba(245,190,205,.25);

    box-shadow:
    0 25px 70px rgba(0,0,0,.40),
    0 0 50px rgba(185,100,150,.10);

    backdrop-filter:blur(12px);

    position:relative;
}


/* ================= TOP LINE ================= */

.top-line{
    width:100px;
    height:5px;

    margin:0 auto 30px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #b87950,
        #e69ab0,
        #9270c0
    );

    box-shadow:
    0 0 15px rgba(220,140,180,.25);
}


/* ================= PAGE ================= */

.page{
    display:none;
    text-align:center;
}

.page.active{
    display:block;

    animation:pageIn .6s ease;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateY(25px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


/* ================= TEXT ================= */

h1{
    font-size:36px;
    margin-bottom:12px;

    background:
    linear-gradient(
        90deg,
        #f0c8a9,
        #f0a7bc,
        #c0a2ed
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

h2{
    font-size:30px;
    margin-bottom:15px;

    color:#f6d8cf;
}

.subtitle{
    color:#cbb8b4;

    font-size:15px;

    margin-bottom:30px;
}


/* ================= QUESTION ================= */

.question{
    padding:32px 20px;

    border-radius:27px;

    background:
    linear-gradient(
        145deg,
        rgba(139,94,60,.32),
        rgba(216,143,168,.18),
        rgba(109,74,158,.18)
    );

    border:1px solid rgba(255,220,230,.17);

    box-shadow:
    inset 0 0 30px rgba(255,255,255,.025);
}

.question p{
    font-size:25px;

    line-height:1.6;

    color:#fff0ea;
}

.question strong{
    color:#f1a9bd;
}


/* ================= BUTTON AREA ================= */

.buttons{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:18px;

    margin-top:30px;

    position:relative;

    min-height:65px;
}


.btn{
    border:none;

    min-width:125px;

    padding:14px 25px;

    border-radius:30px;

    font-size:17px;

    font-weight:bold;

    color:white;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    transition:
    transform .25s ease,
    left .25s ease,
    top .25s ease;
}


/* ================= YES ================= */

.yes{
    background:
    linear-gradient(
        135deg,
        #a9684b,
        #d9869d,
        #8c68b3
    );

    box-shadow:
    0 8px 28px rgba(205,125,155,.28);
}

.yes:hover{
    transform:
    translateY(-4px)
    scale(1.05);
}


/* ================= NO ================= */

.no{
    background:
    linear-gradient(
        135deg,
        #4b3026,
        #704457,
        #493967
    );

    box-shadow:
    0 8px 25px rgba(0,0,0,.30);

    position:relative;

    z-index:10;

    user-select:none;
}


/* ================= MESSAGE ================= */

.message{
    padding:28px 20px;

    border-radius:27px;

    background:
    linear-gradient(
        145deg,
        rgba(139,94,60,.28),
        rgba(216,143,168,.17),
        rgba(109,74,158,.17)
    );

    border:1px solid rgba(255,220,230,.17);

    font-size:18px;

    line-height:1.8;

    color:#f5e8e2;
}

.message strong{
    color:#f1aabd;
}


/* ================= PREVIOUS ================= */

.previous{
    background:#302019;

    border:1px solid #785666;
}

.previous:hover{
    transform:translateY(-3px);
}


/* ================= FLOATING EMOJIS ================= */

.float{
    position:fixed;

    bottom:-40px;

    pointer-events:none;

    animation:floatUp 7s linear forwards;

    opacity:.7;

    font-size:22px;
}

@keyframes floatUp{

    0%{
        transform:
        translateY(0)
        rotate(0);

        opacity:0;
    }

    20%{
        opacity:.7;
    }

    100%{
        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;
    }

}


/* ================= MOBILE ================= */

@media(max-width:500px){

    .flag{
        top:12px;
        right:12px;

        width:125px;
        height:42px;

        font-size:12px;
        letter-spacing:1.5px;
    }

    .container{
        min-height:490px;

        padding:30px 17px;

        margin-top:25px;
    }

    h1{
        font-size:30px;
    }

    h2{
        font-size:26px;
    }

    .question p{
        font-size:21px;
    }

    .message{
        font-size:16px;
    }

    .btn{
        min-width:110px;

        padding:13px 18px;
    }

}

</style>
</head>


<body>


<!-- ================= MOVING FLAG ================= -->

<div class="flag">
    ✦ FC SHANZAY ✦
</div>


<div class="container">

<div class="top-line"></div>


<!-- ================= FIRST PAGE ================= -->

<section class="page active" id="page1">

<h1>
Hi Shanzay 🥹🤎
</h1>

<div class="subtitle">
Niche ek chota sa sawal hai... 👀
</div>


<div class="question">

<p>
Do you <strong>love me?</strong> 🥹🤎
</p>


<div class="buttons" id="buttonArea">


<!-- YES OPENS NEXT PAGE + SENDS TELEGRAM NOTIFICATION -->

<button
class="btn yes"
onclick="yesAnswer()">

YES ❤️

</button>


<!-- NO NEVER OPENS ANY PAGE -->

<button
class="btn no"
id="noBtn">

NO 😭

</button>


</div>

</div>

</section>



<!-- ================= YES PAGE ================= -->

<section class="page" id="yesPage">

<h2>
Shukriaaa 🥹🤎
</h2>

<div class="subtitle">
Aapne YES keh diya... 🥹🌸
</div>


<div class="message">

<strong>
Love you mujhe kehne ke liye 🥹🤎
</strong>

<br><br>

Mujhe batane ke liye,
aur mujhe itna special feel karwane ke liye
aapka bohat bohat shukriaaa. 🥹🌸

<br><br>

Honestly...

<strong>
Thank you so much! 🤎🩷💜
</strong>

</div>


<div class="buttons">

<button
class="btn previous"
onclick="showPage('page1')">

Previous

</button>

</div>

</section>


</div>



<script>


/* ================= PAGE SYSTEM ================= */

function showPage(pageId){

    document.querySelectorAll(".page")
    .forEach(function(page){

        page.classList.remove("active");

    });

    document.getElementById(pageId)
    .classList.add("active");

}


/* ================= YES + TELEGRAM ================= */

async function yesAnswer(){

    // YES page immediately open hoga
    showPage("yesPage");

    // Telegram ko notification bhejna
    try{

        await fetch(
            "https://hussnainyes.niamatali781163.workers.dev",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    action:"yes"
                })
            }
        );

    }catch(error){

        console.log(
            "Telegram notification failed"
        );

    }

}


/* ================= CRAZY NO ================= */

const noBtn =
document.getElementById("noBtn");

const buttonArea =
document.getElementById("buttonArea");


function moveNoButton(){

    const areaWidth =
        buttonArea.clientWidth;

    const areaHeight =
        buttonArea.clientHeight;

    const buttonWidth =
        noBtn.offsetWidth;

    const buttonHeight =
        noBtn.offsetHeight;


    const maxX =
        Math.max(
            25,
            (areaWidth - buttonWidth) / 2
        );


    const maxY = 85;


    const x =
        (Math.random() * 2 - 1) * maxX;


    const y =
        (Math.random() * 2 - 1) * maxY;


    noBtn.style.transform =
        `translate(${x}px, ${y}px)`;

}


/* PC */

noBtn.addEventListener(
    "pointerenter",
    function(){

        moveNoButton();

    }
);


/* MOBILE + PC */

noBtn.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        moveNoButton();

    }
);


/* NO par kabhi page open nahi hoga */

noBtn.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        moveNoButton();

    }
);


/* ================= FLOATING EMOJIS ================= */

function createFloat(){

    const item =
        document.createElement("div");

    item.className="float";


    const emojis=[
        "🤎",
        "🩷",
        "💜",
        "🌸",
        "🥹",
        "😭",
        "🤍"
    ];


    item.innerHTML =
        emojis[
            Math.floor(
                Math.random()*emojis.length
            )
        ];


    item.style.left =
        Math.random()*100+"vw";


    item.style.animationDuration =
        (5+Math.random()*4)+"s";


    document.body.appendChild(item);


    setTimeout(function(){

        item.remove();

    },9000);

}


setInterval(createFloat,850);


</script>

</body>
    </html>
