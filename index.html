<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Shanzay 🤎</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at top left,#8b5e3c 0%,transparent 35%),
    radial-gradient(circle at bottom right,#d69a9a 0%,transparent 40%),
    linear-gradient(135deg,#241712,#4b3023,#ead4c4);

    color:white;
    overflow:hidden;
}


/* ================= MAIN CARD ================= */

.container{
    width:100%;
    max-width:560px;
    min-height:500px;

    padding:35px 24px;

    border-radius:32px;

    background:rgba(48,30,22,.90);

    border:1px solid rgba(255,220,200,.25);

    box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 0 40px rgba(255,255,255,.03);

    backdrop-filter:blur(10px);

    position:relative;
}

.top-line{
    width:85px;
    height:4px;

    margin:0 auto 30px;

    border-radius:20px;

    background:linear-gradient(
        90deg,
        #d6a77a,
        #e8a7a7
    );
}


/* ================= PAGES ================= */

.page{
    display:none;
    text-align:center;
}

.page.active{
    display:block;

    animation:pageIn .6s ease;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


h1{
    font-size:36px;
    margin-bottom:12px;
    color:#ffe9dc;
}

h2{
    font-size:30px;
    margin-bottom:15px;
    color:#ffe1d1;
}

.subtitle{
    color:#cdb8ad;
    font-size:15px;
    margin-bottom:30px;
}


/* ================= QUESTION ================= */

.question{
    padding:30px 20px;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        rgba(130,85,55,.35),
        rgba(180,105,105,.20)
    );

    border:1px solid rgba(255,220,200,.18);

    box-shadow:
    inset 0 0 30px rgba(255,255,255,.025);
}

.question p{
    font-size:24px;
    line-height:1.6;
    color:#fff1e9;
}

.question strong{
    color:#f3b4b4;
}


/* ================= BUTTON AREA ================= */

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;

    margin-top:30px;

    position:relative;
    min-height:60px;
}


.btn{
    border:none;

    min-width:125px;

    padding:14px 25px;

    border-radius:30px;

    font-size:17px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    transition:
    transform .25s ease,
    left .25s ease,
    top .25s ease;

    -webkit-tap-highlight-color:transparent;
}


.yes{
    background:linear-gradient(
        135deg,
        #9b5f4a,
        #d88989
    );

    box-shadow:
    0 8px 25px rgba(210,130,130,.25);
}

.yes:hover{
    transform:translateY(-3px) scale(1.04);
}


/* ================= NO BUTTON ================= */

.no{
    background:linear-gradient(
        135deg,
        #513329,
        #754638
    );

    box-shadow:
    0 8px 25px rgba(0,0,0,.25);

    position:relative;

    z-index:10;
}


/* ================= MESSAGE ================= */

.message{
    padding:28px 20px;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        rgba(139,94,60,.30),
        rgba(200,130,130,.18)
    );

    border:1px solid rgba(255,220,200,.18);

    font-size:18px;
    line-height:1.8;

    color:#f5e7df;
}

.message strong{
    color:#f0b4b4;
}


/* ================= PREVIOUS ================= */

.previous{
    background:#302019;

    border:1px solid #725344;
}

.previous:hover{
    transform:translateY(-3px);
}


/* ================= FLOATING HEARTS ================= */

.heart{
    position:fixed;

    bottom:-40px;

    pointer-events:none;

    animation:floatUp 7s linear forwards;

    opacity:.7;

    font-size:22px;
}

@keyframes floatUp{

    0%{
        transform:
        translateY(0)
        rotate(0);

        opacity:0;
    }

    20%{
        opacity:.7;
    }

    100%{
        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;
    }

}


/* ================= MOBILE ================= */

@media(max-width:500px){

    .container{
        min-height:490px;
        padding:30px 17px;
    }

    h1{
        font-size:30px;
    }

    h2{
        font-size:26px;
    }

    .question p{
        font-size:21px;
    }

    .message{
        font-size:16px;
    }

    .btn{
        min-width:110px;
        padding:13px 18px;
    }

}

</style>
</head>


<body>


<div class="container">

<div class="top-line"></div>


<!-- ================= PAGE 1 ================= -->

<section class="page active" id="page1">

<h1>
Hi Shanzayyyy 🥹🤎
</h1>

<div class="subtitle">
Niche ek chota sa sawal hai... 👀
</div>


<div class="question">

<p>
Do you <strong>love me?</strong> 🥹🤎
</p>


<div class="buttons" id="buttonArea">

<button
class="btn yes"
onclick="showPage('yesPage')">
YES ❤️
</button>


<button
class="btn no"
id="noBtn">
NO 😭
</button>

</div>

</div>

</section>



<!-- ================= YES PAGE ================= -->

<section class="page" id="yesPage">

<h2>
Shukriaaa 🥹🤎
</h2>

<div class="subtitle">
Aapne YES keh diya... 🥹🌸
</div>


<div class="message">

<strong>
Love you mujhe kehne ke liye 🥹🤎
</strong>

<br><br>

Mujhe batane ke liye
aur mujhe itna special feel karwane ke liye
aapka bohat bohat shukriaaa. 🥹🌸

<br><br>

Honestly...
<strong>Thank you so much! 🤎</strong>

</div>


<div class="buttons">

<button
class="btn previous"
onclick="showPage('page1')">
Previous
</button>

</div>

</section>


</div>



<script>


/* ================= PAGE SYSTEM ================= */

function showPage(pageId){

    document.querySelectorAll(".page")
    .forEach(function(page){

        page.classList.remove("active");

    });

    document.getElementById(pageId)
    .classList.add("active");

}


/* ================= NO BUTTON ================= */

const noBtn =
document.getElementById("noBtn");

const buttonArea =
document.getElementById("buttonArea");


function moveNo(){

    const areaWidth =
        buttonArea.clientWidth;

    const areaHeight =
        buttonArea.clientHeight;


    const btnWidth =
        noBtn.offsetWidth;

    const btnHeight =
        noBtn.offsetHeight;


    /*
       Button ko area ke andar hi
       random jagah par move karenge.
    */

    const maxX =
        Math.max(
            20,
            (areaWidth - btnWidth) / 2
        );


    const maxY = 80;


    const randomX =
        (Math.random() * 2 - 1) * maxX;


    const randomY =
        (Math.random() * 2 - 1) * maxY;


    noBtn.style.transform =
        `translate(${randomX}px, ${randomY}px)`;

}


/*
   PC mouse:
   NO par mouse le jayenge
   to button move karega.
*/

noBtn.addEventListener(
    "pointerenter",
    function(){

        moveNo();

    }
);


/*
   Mobile:
   NO ko touch/press karte hi
   button move karega.

   IMPORTANT:
   preventDefault() ki wajah se
   NO ka click execute nahi hoga.
*/

noBtn.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        moveNo();

    }
);


/*
   Extra safety:
   NO button ka click kuch bhi nahi karega.
*/

noBtn.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        moveNo();

    }
);


/* ================= FLOATING HEARTS ================= */

function createHeart(){

    const heart =
        document.createElement("div");

    heart.className="heart";


    const emojis=[
        "🤎",
        "🌸",
        "🥹",
        "✨",
        "🤍",
        "💗"
    ];


    heart.innerHTML =
        emojis[
            Math.floor(
                Math.random()*emojis.length
            )
        ];


    heart.style.left =
        Math.random()*100+"vw";


    heart.style.animationDuration =
        (5+Math.random()*4)+"s";


    document.body.appendChild(heart);


    setTimeout(function(){

        heart.remove();

    },9000);

}


setInterval(createHeart,900);


</script>

</body>
</html>
